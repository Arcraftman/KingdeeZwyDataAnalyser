[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kingdee-zwy-data-analyser"
version = "0.1.0"
description = "Kingdee Zwy Electron finance dashboard"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "requests>=2.31,<3"]

[project.optional-dependencies]
login = []
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
kingdee-zwy-data-analyser = "KingdeeZwyDataAnalyser.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["KingdeeZwyDataAnalyser*"]

[tool.setuptools.package-data]
KingdeeZwyDataAnalyser = ["conf/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".kdzda", "build", "dist", "node_modules", "runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
